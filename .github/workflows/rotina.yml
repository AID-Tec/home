# =============================================================================
# Pacto Gorjeta · rotina automática de envio (GitHub Actions)
# =============================================================================
# Por que existe: o agendador do PC dependia de alguém lembrar/agendar. Aqui o
# relógio mora no GitHub (24/7, grátis porque o repo é público) e roda a MESMA
# ferramenta testada — ferramentas/disparo/disparar.js — no modo --rotina, que
# decide sozinho o que venceu lendo a tabela "envios" no banco.
#
# Três gatilhos por dia útil (horário de Brasília, UTC-3, sem horário de verão):
#   09:00 BRT = 12:00 UTC  -> faixa das 9h  (1º contato / atrasados)
#   15:00 BRT = 18:00 UTC  -> faixas 9 e 15 (D+4)
#   18:00 BRT = 21:00 UTC  -> todas         (D+9 + tudo que ficou pendendo)
# Se um gatilho atrasar além da tolerância da ferramenta (18h05), nada se
# perde: o próximo gatilho pega os vencidos (é assim que a rotina foi feita).
#
# SEGREDOS: só nos Secrets do repositório (Settings → Secrets → Actions) e
# injetados como variáveis de ambiente. Nenhum valor aqui; nenhum no Git.
# O repo é público e o LOG do workflow também — por isso a ferramenta liga o
# modo sigilo sozinha quando detecta CI=true (nenhum e-mail de prospecto no log).
# =============================================================================
name: Pacto · rotina de envio

on:
  schedule:
    - cron: '7 12 * * 1-5'   # 09:07 BRT (seg–sex) — fora do pico :00 UTC
    - cron: '7 18 * * 1-5'   # 15:07 BRT (seg–sex) — fora do pico :00 UTC
    - cron: '7 21 * * 1-5'   # 18:07 BRT (seg–sex) — fora do pico :00 UTC
    - cron: '30 22 * * 1-5'  # 19:30 BRT (seg–sex) — gatilho de RESGATE: pega o que ficou pendendo se os anteriores atrasarem/falharem
  workflow_dispatch:          # gatilho manual (teste/retomada)
    inputs:
      enviar:
        description: 'Enviar de verdade (vazio = só mostra o plano)'
        type: boolean
        default: false

# permissão mínima: o job só lê o código; os segredos vêm do cofre do repo
permissions:
  contents: read

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # variáveis de ambiente = segredos do cofre (nunca aparecem no YAML)
    env:
      BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}   # senha de envio (xsmtpsib-)
      BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }} # login SMTP
      BREVO_SMTP_HOST: ${{ secrets.BREVO_SMTP_HOST }} # servidor
      BREVO_SMTP_PORT: ${{ secrets.BREVO_SMTP_PORT }} # porta
      PACTO_EMAIL: ${{ secrets.PACTO_EMAIL }}         # login do painel
      PACTO_SENHA: ${{ secrets.PACTO_SENHA }}         # senha do painel
    steps:
      - name: Pegar o código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # a ferramenta não tem dependência nenhuma (usa só o Node de fábrica)

      - name: Checar segredos do cofre
        id: cofre
        # se ainda não houver segredo cadastrado, o job AVISA e passa reto:
        # nunca falha vermelho por falta de configuração e nunca envia sem chave
        env:
          FALTA: ${{ secrets.BREVO_SMTP_KEY == '' || secrets.PACTO_SENHA == '' }}
        run: |
          if [ "$FALTA" = "true" ]; then
            echo "pulado=1" >> "$GITHUB_OUTPUT"
            echo "::notice::Cofre de segredos ainda vazio — nada foi enviado. Cadastre BREVO_SMTP_KEY/BREVO_SMTP_USER/BREVO_SMTP_HOST/BREVO_SMTP_PORT/PACTO_EMAIL/PACTO_SENHA em Settings → Secrets and variables → Actions."
          else
            echo "pulado=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Rotina (o que venceu neste gatilho)
        if: steps.cofre.outputs.pulado == '0'
        run: |
          set -euo pipefail
          FLAGS="--rotina"
          # agendamento automático envia; gatilho manual só envia se pedir
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.enviar }}" = "true" ]; then
            FLAGS="$FLAGS --enviar"
          fi
          echo "modo: $FLAGS"
          node ferramentas/disparo/disparar.js $FLAGS | tee rotina.log

      # acorda o n8n no Render e dispara a checagem de retorno/alertas.
      # continue-on-error: se o n8n estiver dormindo/falhando, o envio do dia
      # NÃO pode ser dado como perdido — ele já saiu aqui.
      - name: Avisar o n8n (retorno/alertas)
        if: ${{ steps.cofre.outputs.pulado == '0' }}
        continue-on-error: true
        env:
          N8N_WEBHOOK: ${{ secrets.N8N_WEBHOOK }}
        run: |
          if [ -z "$N8N_WEBHOOK" ]; then
            echo 'N8N_WEBHOOK não configurado — pulando.'
            exit 0
          fi
          curl -fsS -m 45 -X POST -H 'Content-Type: application/json' \
            -d '{"origem":"github-actions","gatilho":"${{ github.event_name }}"}' \
            "$N8N_WEBHOOK" || true

      # ---------------------------------------------------------------------
      # Aviso no WhatsApp/Telegram (NOTIFIER) — SEMPRE roda, dê sucesso ou erro.
      # Mensagem por evento: um aviso para cada execução agendada ou manual.
      # Nenhum dado de prospecto vai na mensagem (só contagem e link do run).
      # ---------------------------------------------------------------------
      - name: Notificar resultado (WhatsApp/Telegram)
        if: always()
        continue-on-error: true
        env:
          # local (sua maquina, via Tailscale Funnel) = WhatsApp + Telegram
          NOTIFIER_LOCAL: ${{ secrets.NOTIFIER_LOCAL_URL }}
          # nuvem (Render) = reserva com Telegram, usada só se o PC estiver off
          NOTIFIER_URL: ${{ secrets.NOTIFIER_URL }}
          NOTIFIER_KEY: ${{ secrets.NOTIFIER_KEY }}
          RESULTADO: ${{ job.status }}
          GATILHO: ${{ github.event_name }}
          RUN_NUM: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PULADO: ${{ steps.cofre.outputs.pulado }}
        run: |
          if [ -z "$NOTIFIER_LOCAL" ] && [ -z "$NOTIFIER_URL" ]; then
            echo 'Notifier não configurado — pulando aviso.'
            exit 0
          fi

          case "$RESULTADO" in
            success)   ICONE="✅"; PALAVRA="concluída" ;;
            failure)   ICONE="❌"; PALAVRA="FALHOU" ;;
            cancelled) ICONE="⚪"; PALAVRA="cancelada" ;;
            *)         ICONE="⚠️"; PALAVRA="$RESULTADO" ;;
          esac

          # resumo da rotina (contagens), quando existir
          RESUMO=""
          if [ -f rotina.log ]; then
            RESUMO=$(grep -m1 'enviados \.\.\.' rotina.log 2>/dev/null | sed 's/^[[:space:]]*//' || true)
          fi
          if [ "$PULADO" = "1" ]; then
            RESUMO="cofre de segredos vazio — nada foi enviado"
          fi

          MENSAGEM="Gatilho: ${GATILHO} · run #${RUN_NUM}"
          if [ -n "$RESUMO" ]; then
            MENSAGEM="${MENSAGEM}\n${RESUMO}"
          fi
          MENSAGEM="${MENSAGEM}\n${RUN_URL}"

          BODY=$(node -e '
            const [titulo, mensagem] = [process.argv[1], process.argv[2].replace(/\\n/g, "\n")];
            process.stdout.write(JSON.stringify({ fonte: "github-actions", titulo, mensagem }));
          ' "${ICONE} Pacto · rotina ${PALAVRA}" "$MENSAGEM")

          # 1) tenta a máquina (WhatsApp + Telegram); 2) se o PC estiver off,
          #    cai para o Render (Telegram), para nunca ficar sem aviso.
          ENTREGUE=0
          if [ -n "$NOTIFIER_LOCAL" ]; then
            if curl -fsS -m 30 -X POST "$NOTIFIER_LOCAL/notify" \
              -H 'Content-Type: application/json' \
              -H "x-notifier-key: $NOTIFIER_KEY" \
              -d "$BODY"; then
              ENTREGUE=1
            else
              echo 'notifier local indisponível (PC desligado?) — tentando reserva.'
            fi
          fi

          if [ "$ENTREGUE" = "0" ] && [ -n "$NOTIFIER_URL" ]; then
            curl -fsS -m 120 -X POST "$NOTIFIER_URL/notify" \
              -H 'Content-Type: application/json' \
              -H "x-notifier-key: $NOTIFIER_KEY" \
              -d "$BODY" || echo 'aviso não entregue (segue o jogo)'
          fi
