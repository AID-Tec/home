<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artes — Pacto Gorjeta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#182A69; --azul2:#2E3699; --indigo-50:#F0F1F8; --indigo-100:#E0E1F0;
  --fundo:#F9F9F9; --card:#FFFFFF; --borda:#E4E4E4; --texto:#1C1C1C; --cinza:#6E6E6E;
  --verde:#1E9E5A; --roxo:#4509AE;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'Montserrat',system-ui,sans-serif;
  background:var(--fundo); color:var(--texto); font-size:15px; line-height:1.55}
header{position:sticky;top:0;background:var(--azul);color:#fff;padding:14px 16px;z-index:10;
  box-shadow:0 2px 10px rgba(0,0,0,.25)}
header h1{margin:0;font-size:18px;font-weight:800}
header .sub{opacity:.8;font-size:12px;margin-top:2px}
nav{margin-top:10px}
nav a{color:#cfe4f7;text-decoration:none;background:rgba(255,255,255,.12);
  padding:7px 11px;border-radius:6px;font-size:12px;font-weight:700;display:inline-block}
.container{max-width:760px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tab{border:1px solid var(--borda);background:#fff;border-radius:999px;padding:9px 14px;
  font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.tab.ativo{background:var(--azul2);color:#fff;border-color:var(--azul2)}
.contagem{color:var(--cinza);font-size:12px;margin:8px 2px 14px}

.bloco{background:var(--card);border:1px solid var(--borda);border-radius:14px;
  overflow:hidden;margin-bottom:18px;box-shadow:0 1px 2px rgba(28,28,28,.04)}
.bloco .topo{padding:14px 16px}
.bloco .titulo{font-weight:800;font-size:17px;line-height:1.3}
.bloco .hook{color:var(--cinza);font-size:13px;margin-top:4px}
.badge{display:inline-block;background:var(--indigo-100);color:var(--azul2);
  border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.badge.aprovado{background:#e0f5ea;color:var(--verde)}
.badge.postado{background:#eee6fb;color:var(--roxo)}

/* carrossel de artes: rola na horizontal, cada slide 1 quadrado */
.arts{display:flex;gap:10px;overflow-x:auto;padding:0 16px 14px;
  scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch}
.arts img{flex:0 0 auto;width:78vw;max-width:340px;aspect-ratio:1/1;object-fit:cover;
  border-radius:10px;border:1px solid var(--borda);scroll-snap-align:center;
  background:var(--indigo-50)}
.legenda{padding:0 16px 16px;font-size:13.5px;color:var(--texto);white-space:pre-line;
  line-height:1.6}
.dica{padding:0 16px 14px;font-size:12px;color:var(--cinza)}
.vazio{text-align:center;color:var(--cinza);padding:44px 16px}
.rodape{padding:8px 16px 30px;font-size:11.5px;color:var(--cinza);text-align:center}
</style>
</head>
<body>
<header>
  <h1>Artes — Pacto Gorjeta</h1>
  <div class="sub">Olhe as artes antes de publicar</div>
  <nav><a href="index.html">← Painel</a></nav>
</header>

<main class="container">
  <div class="tabs">
    <button class="tab ativo" data-tab="aguardando">A revisar</button>
    <button class="tab" data-tab="aprovado">Aprovados</button>
    <button class="tab" data-tab="postado">Postados</button>
  </div>
  <div class="contagem" id="contagem"></div>
  <div id="lista"></div>
  <div class="rodape">Fluxo: você olha as artes aqui e me fala “aprovo” ou o ajuste.<br>Movimento as pastas e essa página acompanha.</div>
</main>

<script>
const BASE = 'conteudo/manifest.json';
let ITENS = [];
let aba = 'aguardando';

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function carregar(){
  const el = document.getElementById('lista');
  el.innerHTML = '<div class="vazio">Carregando…</div>';
  try{
    const r = await fetch(BASE+'?'+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const m = await r.json();
    ITENS = m.itens || [];
    const c = m.contagem || {};
    document.getElementById('contagem').textContent =
      (c.aguardando||0)+' pra revisar · '+(c.aprovado||0)+' aprovado(s) · '+(c.postado||0)+' postado(s)';
    render();
  }catch(e){
    el.innerHTML = '<div class="vazio">Não consegui carregar o manifesto.<br><small>'+esc(e.message)+'</small></div>';
  }
}

function render(){
  const el = document.getElementById('lista');
  const arr = ITENS.filter(i=>i.status===aba);
  if(!arr.length){
    el.innerHTML = '<div class="vazio">Nada nesta aba.</div>';
    return;
  }
  el.innerHTML = arr.map(item=>{
    const imgs = (item.arte||[]).map(p=>
      '<img loading="lazy" src="'+BASE.replace('manifest.json','')+esc(p)+'?'+Date.now()+'" alt="'+esc(item.titulo)+'">'
    ).join('');
    return `
    <article class="bloco">
      <div class="topo">
        <span class="badge ${esc(item.status)}">${esc(item.status)}</span>
        <div class="titulo">${esc(item.titulo)}</div>
        ${item.hook?`<div class="hook">${esc(item.hook)}</div>`:''}
      </div>
      ${item.tem_arte
        ? `<div class="arts">${imgs}</div><div class="dica">Arrastra pra ver os ${ (item.arte||[]).length } slides →</div>`
        : `<div class="vazio">Sem arte gerada ainda.</div>`}
      ${item.legenda?`<div class="legenda">${esc(item.legenda)}</div>`:''}
    </article>`;
  }).join('');
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('ativo'));
  t.classList.add('ativo');
  aba = t.dataset.tab;
  render();
}));

carregar();
</script>
</body>
</html>
